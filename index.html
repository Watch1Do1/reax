<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ignore Vite HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var r = event.reason;
        var msg = (r && (r.message || r.stack || String(r))) || '';
        if (msg.includes('WebSocket') || msg.includes('vite') || (r && r.stack && r.stack.includes('@vite/client'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var file = event.filename || '';
        if (msg.includes('WebSocket') || file.includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
