<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="reaxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle with Reax Brand Gradient -->
  <rect width="32" height="32" rx="7.5" fill="url(#reaxGradient)"/>
  
  <!-- Film Frame Reaction Mark -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <rect x="5.5" y="5.5" width="21" height="21" rx="3.5"/>
    <line x1="10.5" y1="5.5" x2="10.5" y2="26.5"/>
    <line x1="21.5" y1="5.5" x2="21.5" y2="26.5"/>
    <line x1="5.5" y1="16" x2="26.5" y2="16"/>
  </g>
  <!-- Center Play Reaction Triangle -->
  <polygon points="14.5,12 20,16 14.5,20" fill="#FFFFFF" filter="url(#subtleGlow)"/>
</svg>